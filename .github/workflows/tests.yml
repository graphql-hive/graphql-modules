name: Tests

on:
  push:
    branches:
      - master
  pull_request: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: the-guild-org/shared-config/.github/workflows/lint.yml@main
    with:
      script: yarn ci:lint
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup env
        uses: the-guild-org/shared-config/setup@main
        with:
          nodeVersion: 26
      # graphql v17 is installed as `graphql`, v16 as `graphql-16` (npm alias)
      - name: Type Check (GraphQL v17)
        run: yarn ts:check
      - name: Type Check (GraphQL v16)
        run: yarn ts:check:graphql-16

  test:
    # every test runs against all supported graphql versions, see `vitest.config.ts`
    name: Unit Test on Node ${{matrix.node-version}} (${{matrix.os}})
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest] # remove windows to speed up the tests
        node-version: [22, 24, 26]
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup env
        uses: the-guild-org/shared-config/setup@main
        with:
          nodeVersion: ${{matrix.node-version}}
      - name: Test
        run: yarn test
        env:
          CI: true
  test_esm:
    name: ESM Test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup env
        uses: the-guild-org/shared-config/setup@main
        with:
          nodeVersion: 26
      - name: Build Packages
        run: yarn build
      - name: Test ESM
        run: node scripts/test-esm.mjs
